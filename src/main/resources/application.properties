spring.application.name=fixit-backend

### SERVER
server.port=8081
server.servlet.context-path=/fixit-backend

### DATASOURCE
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-fixit-backend:5432/fixitbackend}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:fixitbackend}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:fixitbackend}
spring.datasource.driver-class-name=org.postgresql.Driver

### JPA/HIBERNATE
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

### LOGGING
logging.level.com.zaxxer.hikari.HikariConfig=${LOGGING_LEVEL:DEBUG}
logging.level.org.hibernate.orm.connections.pooling=${LOGGING_LEVEL:WARN}

### ACTUATOR
management.endpoints.web.exposure.include=health,info,metrics,mappings
management.endpoint.health.show-details=always

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8080/realms/fixit
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/realms/fixit/protocol/openid-connect/certs
logging.level.org.springframework.security=DEBUG
