apiVersion: batch/v1
kind: Job
metadata:
  name: k6-load-test
  namespace: fixit
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6
          command: ["k6", "run", "/scripts/load-test.js"]
          volumeMounts:
            - name: k6-scripts
              mountPath: /scripts
          env:
            - name: BASE_URL
              value: "http://fixit-backend-service:80"
      volumes:
        - name: k6-scripts
          configMap:
            name: k6-script
