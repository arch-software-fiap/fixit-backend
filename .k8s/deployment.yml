apiVersion: apps/v1
kind: Deployment
metadata:
  name: fixit-backend-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fixit-backend-service
  template:
    metadata:
      labels:
        app: fixit-backend-service
    spec:
      containers:
        - name: ${project.artifactId}
          image: ghcr.io/arch-software-fiap/fixit-backend:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 125m
              memory: 512Mi
            limits:
              memory: 1024Mi
      imagePullSecrets:
        - name: ghcr-secret

