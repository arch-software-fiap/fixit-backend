apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: fixit-backend
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - fixit
  selector:
    matchLabels:
      app: fixit-backend
  endpoints:
    - port: http
      path: /fixit-backend/actuator/prometheus
      interval: 30s
      scrapeTimeout: 10s
