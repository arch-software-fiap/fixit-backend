apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: fixit
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:23.0
          args:
            - start-dev
            - --import-realm
          env:
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: keycloak-secret
                  key: KEYCLOAK_ADMIN
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-secret
                  key: KEYCLOAK_ADMIN_PASSWORD
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HOSTNAME_STRICT_HTTPS
              value: "false"
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: realm-config
              mountPath: /opt/keycloak/data/import/realm-export.json
              subPath: realm-export.json
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1024Mi
          # A imagem quay.io/keycloak/keycloak:23.0 (UBI9 minimal) nao possui curl/wget.
          # bash /dev/tcp e um builtin nativo — faz HTTP sem dependencias externas.
          # startupProbe: 60s delay + 30x15s = ate 510s para Keycloak 23 + import-realm.
          startupProbe:
            exec:
              command:
                - bash
                - -c
                - >-
                  exec 3<>/dev/tcp/localhost/8080 &&
                  printf "GET ${KC_HTTP_RELATIVE_PATH}/realms/fixit HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 &&
                  read -t5 -r line <&3 &&
                  [[ "$line" == *"200"* ]]
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - >-
                  exec 3<>/dev/tcp/localhost/8080 &&
                  printf "GET ${KC_HTTP_RELATIVE_PATH}/realms/fixit HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 &&
                  read -t5 -r line <&3 &&
                  [[ "$line" == *"200"* ]]
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - bash
                - -c
                - >-
                  exec 3<>/dev/tcp/localhost/8080 &&
                  printf "GET ${KC_HTTP_RELATIVE_PATH}/realms/fixit HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 &&
                  read -t5 -r line <&3 &&
                  [[ "$line" == *"200"* ]]
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: realm-config
          configMap:
            name: keycloak-realm