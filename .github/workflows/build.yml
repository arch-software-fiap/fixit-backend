name: CI/CD Pipeline Java

on:
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  ARTIFACT_NAME: 'app-${{ github.event.repository.name }}-${{ github.run_number }}'
  AWS_REGION: us-east-1

jobs:

  tests:
    name: Tests
    runs-on: ${{ vars.RUNS_ON }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Tests
        run: mvn test

  package:
    name: Package
    runs-on: ${{ vars.RUNS_ON }}
    needs: [ tests ]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Packaging application
        run: mvn package -DskipTests

      - name: Upload artifact jar
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: infra/target/*.jar
          retention-days: 3

  containerize:
    name: containerize
    runs-on: ${{ vars.RUNS_ON }}
    needs: [ package ]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Download artifact jar
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: infra/target

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy no EKS
    runs-on: ubuntu-latest
    needs: [ containerize ]
    environment: >-
      ${{ (github.event.workflow_run.head_branch == 'main' || github.ref_name == 'main') && 'prod' ||
          (github.event.workflow_run.head_branch == 'hmg'  || github.ref_name == 'hmg')  && 'hmg'  ||
          'dev' }}
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Resolver ambiente
        id: env
        run: |
          BRANCH="${{ github.event.workflow_run.head_branch || github.ref_name }}"
          if [ "$BRANCH" == "main" ]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
            echo "cluster=production-fixit-eks" >> $GITHUB_OUTPUT
          elif [ "$BRANCH" == "hmg" ]; then
            echo "environment=hmg" >> $GITHUB_OUTPUT
            echo "cluster=homologation-fixit-eks" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
            echo "cluster=development-fixit-eks" >> $GITHUB_OUTPUT
          fi

      - name: Configurar AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configurar kubectl
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ steps.env.outputs.cluster }}

      - name: Criar namespace
        run: kubectl apply -f .k8s/namespace.yml

      - name: Criar Secret GHCR
        run: |
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GHCR_PAT }} \
            -n fixit \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Criar Secret da aplicacao
        run: |
          kubectl create secret generic fixit-backend-secret \
            --from-literal=SPRING_DATASOURCE_URL=${{ secrets.SPRING_DATASOURCE_URL }} \
            --from-literal=SPRING_DATASOURCE_USERNAME=${{ secrets.SPRING_DATASOURCE_USERNAME }} \
            --from-literal=SPRING_DATASOURCE_PASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD }} \
            --from-literal=LOGGING_LEVEL=INFO \
            -n fixit \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy fixit-backend
        run: |
          kubectl apply -f .k8s/fixit-backend/deployment.yml
          kubectl apply -f .k8s/fixit-backend/service.yml
          kubectl apply -f .k8s/fixit-backend/hpa.yml
          kubectl apply -f .k8s/fixit-backend/ingress.yml

      - name: Atualizar imagem com SHA do commit
        run: |
          kubectl set image deployment/fixit-backend \
            fixit-backend=ghcr.io/${{ github.repository }}:${{ github.sha }} \
            -n fixit

      - name: Aguardar rollout
        run: |
          kubectl rollout status deployment/fixit-backend -n fixit --timeout=300s

  deploy-api-gateway:
    name: Deploy API Gateway
    runs-on: ubuntu-latest
    needs: [ deploy ]
    permissions:
      actions: write
      contents: read

    steps:
      - name: Resolver ambiente
        id: env
        run: |
          BRANCH="${{ github.event.workflow_run.head_branch || github.ref_name }}"
          if [ "$BRANCH" == "main" ]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          elif [ "$BRANCH" == "hmg" ]; then
            echo "environment=hmg" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

      - name: Disparar Terraform API Gateway
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/api-gateway.yml/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\",\"inputs\":{\"environment\":\"${{ steps.env.outputs.environment }}\",\"action\":\"apply\"}}" \
            -w "HTTP: %{http_code}\n"
