name: CI/CD Pipeline Java

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  MAVEN_VERSION: '3.9.5'
  RUNS_ON: 'ubuntu-22.04'

jobs:

  test:
    name: Tests
    runs-on: ${{ env.RUNS_ON }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Tests
        run: mvn test

  package:
    name: Package
    runs-on: ${{ env.RUNS_ON }}
    needs: [ test ]

#    outputs:
#      artifact-name: ${{ steps.meta.outputs.artifact }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Packaging
        run: mvn package -DskipTests


#    - name: Upload do artefato JAR
#        uses: actions/upload-artifact@v4
#        with:
#          name: ${{ steps.meta.outputs.artifact }}
#          path: target/*.jar
#          retention-days: 3

      - name: Upload do artefato JAR
        uses: actions/upload-artifact@v4
        with:
          name: ${{github.event.repository.name}}-${{github.sha}}
          path: target/*.jar
          retention-days: 3

  build:
    name: Build docker image
    runs-on: ${{ env.RUNS_ON }}
    needs: [ package ]

    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Download do artefato JAR
        uses: actions/download-artifact@v4
        with:
          name: ${{github.event.repository.name}}-${{github.sha}}
          path: target

#      - name: Download do artefato JAR
#        uses: actions/download-artifact@v4
#        with:
#          name: ${{ needs.package.outputs.artifact-name }}
#          path: target

      - name: Build da imagem Docker
        run: docker build -t fixit-backend:latest .

