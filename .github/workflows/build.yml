name: CI/CD Pipeline Java

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  ARTIFACT_NAME: '${{ github.event.repository.name }}-${{ github.sha }}'

jobs:

  test:
    name: Tests
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Tests
        run: mvn test

  package:
    name: Package
    runs-on: ubuntu-22.04
    needs: [ test ]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Packaging
        run: mvn package -DskipTests

      - name: Upload do artefato JAR
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: target/*.jar
          retention-days: 3

  build:
    name: Build docker image
    runs-on: ubuntu-22.04
    needs: [ package ]

    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Download do artefato JAR
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: target

      - name: Build da imagem Docker
        run: docker build -t fixit-backend:latest .

