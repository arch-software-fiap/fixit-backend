name: Terraform EKS

on:
  push:
    branches:
      - dev
      - hmg
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente alvo'
        required: true
        type: choice
        options:
          - dev
          - hmg
          - prod
      action:
        description: 'Acao a executar'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy

env:
  TF_DIR: terraform/eks
  AWS_REGION: us-east-1
  TF_BUCKET: fixit-terraform-state-096626747607
  TF_DYNAMODB_TABLE: fixit-terraform-locks

jobs:
  terraform:
    name: "Terraform EKS"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      action: ${{ steps.env.outputs.action }}

    defaults:
      run:
        working-directory: ${{ env.TF_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolver ambiente
        id: env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
            ACTION="${{ github.event.inputs.action }}"
          elif [ "${{ github.ref_name }}" == "main" ]; then
            ENV="prod"
            ACTION="apply"
          elif [ "${{ github.ref_name }}" == "hmg" ]; then
            ENV="hmg"
            ACTION="apply"
          else
            ENV="dev"
            ACTION="apply"
          fi
          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "action=$ACTION" >> $GITHUB_OUTPUT
          echo "Ambiente: $ENV | Acao: $ACTION"

      - name: Configurar AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TF_BUCKET }}" \
            -backend-config="key=fixit-eks/${{ steps.env.outputs.environment }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ env.TF_DYNAMODB_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var-file="environments/${{ steps.env.outputs.environment }}.tfvars" \
            -no-color \
            -out=tfplan

      - name: Terraform Apply
        if: steps.env.outputs.action == 'apply'
        run: terraform apply -auto-approve tfplan

      - name: Terraform Destroy
        if: steps.env.outputs.action == 'destroy'
        run: |
          terraform destroy \
            -var-file="environments/${{ steps.env.outputs.environment }}.tfvars" \
            -auto-approve

  deploy-keycloak:
    name: "Deploy Keycloak"
    runs-on: ubuntu-latest
    needs: terraform
    if: needs.terraform.outputs.action == 'apply'
    environment: ${{ needs.terraform.outputs.environment }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configurar kubectl
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ needs.terraform.outputs.environment == 'prod' && 'production-fixit-eks' || needs.terraform.outputs.environment == 'hmg' && 'homologation-fixit-eks' || 'development-fixit-eks' }}

      - name: Criar namespace
        run: kubectl apply -f .k8s/namespace.yml

      - name: Criar ConfigMap do Realm
        run: |
          kubectl create configmap keycloak-realm \
            --from-file=realm-export.json=.docker/keycloak/realm-export.json \
            -n fixit \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Criar Secret do Keycloak
        run: |
          kubectl create secret generic keycloak-secret \
            --from-literal=KEYCLOAK_ADMIN=${{ secrets.KEYCLOAK_ADMIN }} \
            --from-literal=KEYCLOAK_ADMIN_PASSWORD=${{ secrets.KEYCLOAK_ADMIN_PASSWORD }} \
            -n fixit \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Keycloak
        run: |
          kubectl apply -f .k8s/keycloak/deployment.yml
          kubectl apply -f .k8s/keycloak/service.yml

      - name: Aguardar Keycloak pronto
        run: |
          kubectl rollout status deployment/keycloak -n fixit --timeout=300s

  trigger-app-deploy:
    name: "Disparar Deploy da Aplicacao"
    runs-on: ubuntu-latest
    needs: [ terraform, deploy-keycloak ]
    if: needs.terraform.outputs.action == 'apply'
    permissions:
      actions: write
      contents: read

    steps:
      - name: Disparar CI/CD Pipeline Java
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/build.yml/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\"}" \
            -w "HTTP: %{http_code}\n"